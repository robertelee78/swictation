name: Build standalone macOS release

on:
  workflow_call:
    inputs:
      official_release:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TARGET: aarch64-apple-darwin
  APPLE_TEAM_ID: '3T2D2YNTVW'

jobs:
  build:
    name: Build macOS payload without signing credentials
    runs-on: macos-14
    outputs:
      version: ${{ steps.package.outputs.version }}
      source_sha: ${{ steps.package.outputs.source_sha }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-darwin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-crates -> target
            tauri-ui/src-tauri -> ${{ runner.temp }}/ui-target
      - name: Test native CLI and Rust workspace
        working-directory: rust-crates
        run: cargo test --locked --workspace --target "$TARGET"
      - name: Pin the signing team in official CLI builds
        if: inputs.official_release
        run: |
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo 'Official releases require APPLE_TEAM_ID'; exit 1; }
          printf 'SWICTATION_APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Build native CLI and daemon with CoreML
        working-directory: rust-crates
        run: |
          cargo build --locked --release --bin swictation --target "$TARGET"
          cargo build --locked --release --bin swictation-daemon --features coreml-native --target "$TARGET"
      - name: Set up Node for Tauri frontend build only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json
      - name: Build desktop app bundle in a clean target directory
        working-directory: tauri-ui
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ui-target
        run: |
          npm ci --ignore-scripts
          npm run tauri -- build --target "$TARGET" --bundles app -- --locked
      - name: Test UI database and protocol regressions
        working-directory: tauri-ui/src-tauri
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ui-target
        run: cargo test --locked --target "$TARGET"
      - name: Fetch ONNX Runtime with CoreML support
        run: bash scripts/distribution/download-onnx.sh "$TARGET" "$RUNNER_TEMP/onnxruntime"
      - name: Stage standalone payload
        run: |
          python3 scripts/distribution/package.py stage --target "$TARGET" \
            --source-sha "$(git rev-parse HEAD)" \
            --cli "rust-crates/target/$TARGET/release/swictation" \
            --daemon "rust-crates/target/$TARGET/release/swictation-daemon" \
            --ui "$RUNNER_TEMP/ui-target/$TARGET/release/swictation-ui" \
            --app "$RUNNER_TEMP/ui-target/$TARGET/release/bundle/macos/Swictation.app" \
            --lib-dir "$RUNNER_TEMP/onnxruntime/onnxruntime-osx-arm64-1.22.0/lib" \
            --stage-dir "$RUNNER_TEMP/swictation-payload"
      - name: Archive unsigned payload and record exact identity
        id: package
        run: |
          python3 scripts/distribution/package.py archive \
            --stage-dir "$RUNNER_TEMP/swictation-payload" --output-dir "$RUNNER_TEMP/distribution"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((temporary / 'swictation-payload/release.json').read_text())
          archive = temporary / 'distribution' / f"swictation-{release['version']}-{release['target']}.tar.gz"
          digest = Path(str(archive) + '.sha256').read_text().split()[0]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"version={release['version']}\nsource_sha={release['source_sha']}\narchive_sha256={digest}\n")
          PY
      - name: Smoke-test unsigned CI package in an isolated home
        if: ${{ !inputs.official_release }}
        run: |
          archive=("$RUNNER_TEMP"/distribution/swictation-*.tar.gz)
          test "${#archive[@]}" = 1
          python3 scripts/distribution/smoke-install.py --archive "${archive[0]}" --allow-unsigned-local
      - name: Upload unsigned payload for the protected signing job
        if: inputs.official_release
        uses: actions/upload-artifact@v4
        with:
          name: swictation-macos-unsigned-payload
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload unsigned CI archive and checksum
        if: ${{ !inputs.official_release }}
        uses: actions/upload-artifact@v4
        with:
          name: swictation-aarch64-apple-darwin
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and notarize the exact macOS release payload
    needs: build
    if: inputs.official_release
    runs-on: macos-14
    environment: apple-release
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      UNSIGNED_SHA256: ${{ needs.build.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: swictation-macos-unsigned-payload
          path: ${{ runner.temp }}/unsigned-distribution
      - name: Verify and unpack the exact source-bound payload
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          archive="$RUNNER_TEMP/unsigned-distribution/swictation-$VERSION-$TARGET.tar.gz"
          test "$(shasum -a 256 "$archive" | awk '{print $1}')" = "$UNSIGNED_SHA256"
          python3 scripts/distribution/package.py verify --archive "$archive" \
            --version "$VERSION" --target "$TARGET" --source-sha "$SOURCE_SHA"
          mkdir "$RUNNER_TEMP/swictation-payload"
          tar -xzf "$archive" -C "$RUNNER_TEMP/swictation-payload"
      - name: Sign, notarize, and verify official release
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/distribution/sign-macos.sh "$RUNNER_TEMP/swictation-payload"
      - name: Package signed release
        run: |
          python3 scripts/distribution/package.py archive \
            --stage-dir "$RUNNER_TEMP/swictation-payload" --output-dir "$RUNNER_TEMP/distribution"
      - name: Smoke-test the signed package in an isolated home
        run: |
          python3 scripts/distribution/smoke-install.py \
            --archive "$RUNNER_TEMP/distribution/swictation-$VERSION-$TARGET.tar.gz"
      - name: Upload signed archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: swictation-aarch64-apple-darwin
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7
