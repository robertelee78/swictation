name: Build standalone Linux release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TARGET: x86_64-unknown-linux-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust-crates -> target
            tauri-ui/src-tauri -> target
      - name: Test native CLI and Rust workspace
        working-directory: rust-crates
        run: cargo test --locked --workspace --target "$TARGET"
      - name: Build native CLI and daemon
        working-directory: rust-crates
        run: cargo build --locked --release --bin swictation --bin swictation-daemon --target "$TARGET"
      - name: Set up Node for Tauri frontend build only
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json
      - name: Build desktop UI
        working-directory: tauri-ui
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ui-target
        run: |
          npm ci --ignore-scripts
          npm run tauri -- build --target "$TARGET" --no-bundle -- --locked
      - name: Fetch ONNX Runtime with Linux CUDA providers
        run: bash scripts/distribution/download-onnx.sh "$TARGET" "$RUNNER_TEMP/onnxruntime"
      - name: Package standalone release
        run: |
          python3 scripts/distribution/package.py stage --target "$TARGET" \
            --source-sha "$(git rev-parse HEAD)" \
            --cli "rust-crates/target/$TARGET/release/swictation" \
            --daemon "rust-crates/target/$TARGET/release/swictation-daemon" \
            --ui "$RUNNER_TEMP/ui-target/$TARGET/release/swictation-ui" \
            --lib-dir "$RUNNER_TEMP/onnxruntime/onnxruntime-linux-x64-gpu-1.23.2/lib" \
            --stage-dir "$RUNNER_TEMP/swictation-payload"
          python3 scripts/distribution/package.py archive \
            --stage-dir "$RUNNER_TEMP/swictation-payload" --output-dir "$RUNNER_TEMP/distribution"
      - name: Smoke-test the exact packaged native lifecycle
        run: |
          archive=("$RUNNER_TEMP"/distribution/swictation-*.tar.gz)
          test "${#archive[@]}" = 1
          python3 scripts/distribution/smoke-install.py --archive "${archive[0]}"
      - name: Upload archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: swictation-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 7
