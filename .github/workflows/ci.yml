name: Native distribution CI

on:
  push:
    branches: [main, rust-migration]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      contracts_only:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  native-cli:
    name: Native CLI and installer contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-crates -> target
      - name: Check CLI formatting
        working-directory: rust-crates
        run: cargo fmt -p swictation-cli -- --check
      - name: Lint native lifecycle
        working-directory: rust-crates
        run: cargo clippy --locked -p swictation-cli --all-targets -- -D warnings
      - name: Test native lifecycle
        working-directory: rust-crates
        run: cargo test --locked -p swictation-cli
      - name: Test bootstrap and archive contracts
        run: python3 -m unittest discover -s scripts/distribution -p 'test_*.py' -v
      - name: Validate shell syntax
        run: |
          sh -n scripts/distribution/install.sh.in
          bash -n scripts/distribution/download-onnx.sh
          bash -n scripts/distribution/sign-macos.sh
  linux:
    if: ${{ !inputs.contracts_only }}
    uses: ./.github/workflows/build-linux.yml
  macos:
    if: ${{ !inputs.contracts_only }}
    uses: ./.github/workflows/build-macos.yml
